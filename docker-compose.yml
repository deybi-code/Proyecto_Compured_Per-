services:

  # ── Aplicación Laravel ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compured_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_NAME: "Compured Peru"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: compured_peru
      DB_USERNAME: compured_user
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database

      LOG_CHANNEL: stderr
      LOG_LEVEL: error
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    networks:
      - compured_net

  # ── Base de datos MySQL ──────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: compured_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: compured_peru
      MYSQL_USER: compured_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"         # quitar en producción
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compured_net

  # ── Migraciones (se ejecuta una sola vez al iniciar) ─────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compured_migrate
    command: php artisan migrate --force
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: compured_peru
      DB_USERNAME: compured_user
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - compured_net
    restart: "no"

volumes:
  mysql_data:
  storage_data:
  logs_data:

networks:
  compured_net:
    driver: bridge
